name: Build and Commit Dist

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.head_commit.author.name != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit and push dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet && echo "No changes to dist — skipping commit." && exit 0
          git commit -m "chore: build dist [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          connect_timeout: 30s
          script: |
            cat > /home/u615309639/domains/refynme.com/deploy.sh << 'EOF'
            #!/bin/bash
            cd /home/u615309639/domains/refynme.com/public_html
            git fetch origin main
            git checkout -f origin/main
            cp -r dist/* .
            cp -n dist/.htaccess . 2>/dev/null || true
            rm -rf dist src public CLAUDE.md eslint.config.js package.json package-lock.json README.md vite.config.js .github
            EOF
            bash /home/u615309639/domains/refynme.com/deploy.sh
